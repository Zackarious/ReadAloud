name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-sounddevice
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-requests
            mingw-w64-ucrt-x86_64-python-beautifulsoup4
            mingw-w64-ucrt-x86_64-onnxruntime
            mingw-w64-ucrt-x86_64-lame
            mingw-w64-ucrt-x86_64-pyinstaller

      - name: Compile GLib GResource Bundle
        run: |
          glib-compile-resources src/readaloud.gresource.xml --target=src/readaloud.gresource --sourcedir=src

      - name: Install Python Dependencies
        run: |
          export PATH="$MSYSTEM_PREFIX/bin:$PATH"
          # Ensure abseil-cpp 2605 DLLs required by MSYS2 onnxruntime are present
          curl -sSL "https://mirror.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-abseil-cpp-20260526.0-1-any.pkg.tar.zst" -o /tmp/absl2605.pkg.tar.zst || true
          if [ -f /tmp/absl2605.pkg.tar.zst ]; then
            tar --zstd -xf /tmp/absl2605.pkg.tar.zst -C "$MSYSTEM_PREFIX/.." ucrt64/bin/ || true
          fi
          for f in "$MSYSTEM_PREFIX"/bin/libabsl_*-*.dll; do
            base=$(basename "$f")
            name=$(echo "$base" | sed -E 's/-[0-9]+(\.[0-9]+)*\.dll//')
            target="$MSYSTEM_PREFIX/bin/${name}-2605.0.0.dll"
            [ -f "$target" ] || cp "$f" "$target" || true
          done
          python3 -m pip install --break-system-packages pypdf pathvalidate
          python3 -m pip install --break-system-packages lameenc || true
          python3 -c "import urllib.request, zipfile, sysconfig, io; url = 'https://files.pythonhosted.org/packages/12/9c/c736d1961cf9ce0655278731b9430df41892ca2ded7b09dabcb340612158/piper_tts-1.8.0-cp39-abi3-win_amd64.whl'; sp = sysconfig.get_paths()['purelib']; r = urllib.request.urlopen(url); zipfile.ZipFile(io.BytesIO(r.read())).extractall(sp)"
          python3 -c "import pathlib, shutil, sys; b = pathlib.Path(sys.executable).parent; (b/'libpython3.14.dll').is_file() and shutil.copy(b/'libpython3.14.dll', b/'python3.dll')"
          python3 -c "import shutil, sysconfig; sp = sysconfig.get_paths()['purelib']; shutil.copytree('build_windows/onnxruntime_shim', sp + '/onnxruntime', dirs_exist_ok=True)"
          python3 -c "import onnxruntime; print('ONNX Runtime successfully loaded from', onnxruntime.__file__)"
          python3 -c "import piper; print('Piper successfully loaded from', piper.__file__)"

      - name: Build Standalone Executable with PyInstaller
        run: |
          export PATH="$MSYSTEM_PREFIX/bin:$PATH"
          pyinstaller build_windows/ReadAloud.spec --clean -y

      - name: Post-Build Runtime Enforcement
        run: |
          mkdir -p dist/ReadAloud/_internal/piper
          python3 -c "import piper, pathlib, shutil; src = pathlib.Path(piper.__file__).parent / 'espeak-ng-data'; dst = pathlib.Path('dist/ReadAloud/_internal/piper/espeak-ng-data'); shutil.copytree(src, dst, dirs_exist_ok=True) if src.is_dir() else None"
          python3 -c "import piper, pathlib, shutil; src = pathlib.Path(piper.__file__).parent / 'tashkeel'; dst = pathlib.Path('dist/ReadAloud/_internal/piper/tashkeel'); shutil.copytree(src, dst, dirs_exist_ok=True) if src.is_dir() else None"
          python3 -c "import pathlib, shutil, sys; b = pathlib.Path(sys.executable).parent; target = pathlib.Path('dist/ReadAloud/_internal'); [shutil.copy(f, target) for f in b.glob('onnxruntime*.dll')]; [shutil.copy(f, target) for f in b.glob('*absl*.dll')]; (b/'python3.dll').is_file() and shutil.copy(b/'python3.dll', target)"
          python3 -c "import pathlib, shutil, sys; b = pathlib.Path(sys.executable).parent; target = pathlib.Path('dist/ReadAloud'); [shutil.copy(f, target) for f in b.glob('onnxruntime*.dll')]; [shutil.copy(f, target) for f in b.glob('*absl*.dll')]; (b/'python3.dll').is_file() and shutil.copy(b/'python3.dll', target)"

      - name: Copy MSVC 2022 CRT Libraries
        shell: cmd
        run: |
          for %%D in (msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll) do (
            if exist "%SystemRoot%\System32\%%D" (
              copy /Y "%SystemRoot%\System32\%%D" "dist\ReadAloud\_internal\"
            )
          )

      - name: Bundle Voice Models
        run: |
          mkdir -p dist/ReadAloud/models
          cp -r models/* dist/ReadAloud/models/
          if [ -f "build_windows/ReadAloud.ico" ]; then
            cp "build_windows/ReadAloud.ico" "dist/ReadAloud/"
          fi

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Compile Windows Installer (.exe)
        shell: cmd
        run: |
          if exist "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" (
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build_windows\installer.iss
          ) else if exist "C:\Program Files\Inno Setup 6\ISCC.exe" (
            "C:\Program Files\Inno Setup 6\ISCC.exe" build_windows\installer.iss
          ) else (
            iscc build_windows\installer.iss
          )

      - name: Create Portable Package
        shell: cmd
        run: |
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=64m -ms=on -v1800m dist\ReadAloud-1.8.10-Windows-Portable-x64.7z .\dist\ReadAloud

      - name: Upload Standalone Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReadAloud-Windows-x64
          path: |
            dist/ReadAloud-1.8.10-Windows-Portable-x64.7z*
            dist/ReadAloud-1.8.10-Windows-Setup-x64*

      - name: Publish Windows Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist/ReadAloud-1.8.10-Windows-Setup-x64*
          ls -lh dist/ReadAloud-1.8.10-Windows-Portable-x64.7z*
          gh release upload "${{ github.ref_name }}" dist/ReadAloud-1.8.10-Windows-Setup-x64* dist/ReadAloud-1.8.10-Windows-Portable-x64.7z* --clobber
