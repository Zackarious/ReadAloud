name: Build macOS Universal Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: build-macos-universal
    runs-on: macos-14

    steps:
      - name: Checkout Repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Checkout LFS Objects
        run: git lfs checkout

      - name: Install Build Dependencies
        run: |
          brew install p7zip glib

      - name: Build macOS Universal Application Bundle
        run: |
          bash build_macos/build_macos.sh

      - name: Upload macOS Universal Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReadAloud-macOS-Universal
          path: dist/ReadAloud-*-macos-universal.zip*

      - name: Publish macOS Universal Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist/ReadAloud-*-macos-universal.zip*
          gh release upload "${{ github.ref_name }}" dist/ReadAloud-*-macos-universal.zip* --clobber
