name: Build Debian Package (.deb)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: build-debian-package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Checkout LFS Objects
        run: git lfs checkout

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson \
            ninja-build \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            gettext \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libportaudio2 \
            libespeak-ng-dev \
            lame \
            appstream \
            desktop-file-utils \
            dpkg-dev \
            python3-venv \
            python3-pip

      - name: Build Debian Package
        run: |
          bash build_linux/build_deb.sh

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadAloud-Debian-x64
          path: dist/readaloud_1.8.14_amd64.deb

      - name: Publish Debian Package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist/readaloud_1.8.14_amd64.deb
          gh release upload "${{ github.ref_name }}" dist/readaloud_1.8.14_amd64.deb --clobber
